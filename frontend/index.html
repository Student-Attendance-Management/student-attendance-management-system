<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMS</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1d2433;--mut:#6b7385;--pri:#3b5bdb;--bad:#e03131;--ok:#2f9e44;--line:#e2e5ee}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--ink:#e8ebf3;--mut:#9aa3b8;--line:#2b3247}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
main{max-width:920px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:17px}
input,select,button{font:inherit;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:3px 3px 3px 0}
button{background:var(--pri);color:#fff;border:0;cursor:pointer}button.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;color:#fff;display:none;z-index:9}
.big{font-size:42px;font-weight:700}.low{color:var(--bad)}.good{color:var(--ok)}.mut{color:var(--mut)}
.tabs button{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.tabs button.on{background:var(--pri);color:#fff}
@media(max-width:600px){input,select{width:100%}}
</style></head><body>
<header><b>Student Attendance Management</b><span id="who"></span></header>
<main id="app"></main><div id="msg"></div>
<script>
let T=sessionStorage.getItem('t')||'',ROLE=sessionStorage.getItem('r')||'';
const $=s=>document.querySelector(s),app=$('#app');
function toast(t,ok=true){const m=$('#msg');m.textContent=t;m.style.background=ok?'#2f9e44':'#e03131';m.style.display='block';setTimeout(()=>m.style.display='none',3000)}
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
 if(r.status==401&&T){logout(true);throw 0}
 if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){}toast(typeof d=='string'?d:'Error '+r.status,false);throw 0}
 return r.headers.get('content-type')?.includes('json')?r.json():r}
function logout(expired){T='';ROLE='';sessionStorage.clear();if(expired)toast('Session expired, log in again',false);show()}
const tbl=(rows,cols)=>rows.length?`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]??''}</td>`).join('')}</tr>`).join('')}</table>`:'<p class="mut">No data</p>';
const opts=(a,v,l)=>a.map(x=>`<option value="${x[v]}">${typeof l=='function'?l(x):x[l]}</option>`).join('');

function show(){
 $('#who').innerHTML=T?`${ROLE} <button class="sec" onclick="logout()">Logout</button>`:'';
 if(!T)return app.innerHTML=`<div class="card" style="max-width:360px;margin:60px auto"><h2>Login</h2>
 <input id="u" placeholder="Username / email" style="width:100%"><input id="p" type="password" placeholder="Password" style="width:100%" onkeydown="event.key=='Enter'&&login()">
 <button onclick="login()" style="width:100%;margin-top:8px">Login</button></div>`;
 ({Admin:admin,Faculty:faculty,Student:student})[ROLE]();
}
async function login(){try{const r=await api('/auth/login','POST',{username:$('#u').value,password:$('#p').value});
 T=r.token;ROLE=r.role;sessionStorage.setItem('t',T);sessionStorage.setItem('r',ROLE);show()}catch(e){}}

/* ---------- Student ---------- */
async function student(){
 const [p,h]=await Promise.all([api('/attendance/percentage'),api('/attendance/history')]);
 const th=75;
 app.innerHTML=`<div class="card"><h2>My Attendance</h2><div class="big ${p.percentage<th?'low':'good'}">${p.percentage}%</div>
 <p class="mut">${p.attended} of ${p.conducted} classes attended ${p.percentage<th?'· below '+th+'% requirement':''}</p></div>
 <div class="card"><h2>History</h2>${tbl(h,['date','period','subject','status'])}</div>`;
}

/* ---------- Faculty ---------- */
async function faculty(){
 const A=await api('/attendance/summary');
 app.innerHTML=`<div class="card"><h2>Take Attendance</h2><div class="row">
 <select id="as">${opts(A,'assignment_id',a=>`${a.subject} · ${a.class}`)}</select>
 <input id="dt" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="pd" type="number" min="1" value="1" style="width:80px">
 <button onclick="startSession()">Start session</button></div><div id="marks"></div></div>
 <div class="card"><h2>Reports</h2>${reportUI(A)}</div>
 <div class="card"><h2>Low attendance</h2><div id="low"></div></div>
 <div class="card"><h2>Correct a record</h2><div class="row"><input id="cs" placeholder="Session id" style="width:110px"><input id="cst" placeholder="Student id" style="width:110px">
 <select id="cv"><option>Present</option><option>Absent</option></select><button onclick="correct()">Update</button></div></div>`;
 loadLow();
}
async function startSession(){
 const s=await api('/attendance/sessions','POST',{assignment_id:+$('#as').value,date:$('#dt').value,period:+$('#pd').value});
 const st=await api(`/attendance/sessions/${s.id}/students`);
 window.SID=s.id;
 $('#marks').innerHTML=`<p class="mut">Session #${s.id}</p>`+(st.length?`<table>${st.map(x=>`<tr><td>${x.name}</td><td>
 <select data-sid="${x.id}"><option>Present</option><option>Absent</option></select></td></tr>`).join('')}</table>
 <button onclick="submitMarks()">Submit attendance</button>`:'<p class="mut">No active students in this class</p>');
}
async function submitMarks(){
 const records=[...document.querySelectorAll('[data-sid]')].map(e=>({studentId:+e.dataset.sid,status:e.value}));
 await api('/attendance/mark','POST',{sessionId:window.SID,records});toast('Attendance saved');$('#marks').innerHTML='';loadLow();
}
async function correct(){await api('/attendance/correct','PUT',{sessionId:+$('#cs').value,studentId:+$('#cst').value,status:$('#cv').value});toast('Corrected')}
async function loadLow(){const l=await api('/attendance/low');$('#low').innerHTML=tbl(l.students,['name','percentage','attended','conducted'])+`<p class="mut">Threshold ${l.threshold}%</p>`}
function reportUI(A){return `<div class="row"><input id="rf" type="date"><input id="rt" type="date"><input id="rs" placeholder="Student id" style="width:110px">
 <select id="rst"><option value="">Any status</option><option>Present</option><option>Absent</option></select>
 <button onclick="runReport()">Search</button><button class="sec" onclick="runReport(true)">Export CSV</button></div><div id="rep"></div>`}
async function runReport(csv){
 const q=new URLSearchParams();[['dateFrom','rf'],['dateTo','rt'],['studentId','rs'],['status','rst']].forEach(([k,i])=>$('#'+i).value&&q.set(k,$('#'+i).value));
 if(csv){q.set('export','csv');const r=await api('/attendance/report?'+q);const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='attendance_report.csv';a.click();return}
 $('#rep').innerHTML=tbl(await api('/attendance/report?'+q),['student','class','subject','date','period','status']);
}

/* ---------- Admin ---------- */
async function admin(){
 const [C,S,F,R]=await Promise.all([api('/classes'),api('/subjects'),api('/faculty'),api('/rules')]);
 const f=(id,ph,t='text')=>`<input id="${id}" type="${t}" placeholder="${ph}">`;
 app.innerHTML=`
 <div class="card"><h2>Classes & Subjects</h2><div class="row">${f('cn','Class name')}${f('ct','Term')}<button onclick="add('/classes',{name:v('cn'),term:v('ct')})">Add class</button></div>
 <div class="row">${f('sc','Subject code')}${f('sn','Subject name')}<button onclick="add('/subjects',{code:v('sc'),name:v('sn')})">Add subject</button></div>
 <p class="mut">Classes: ${C.map(c=>c.id+'='+c.name).join(', ')||'none'} · Subjects: ${S.map(c=>c.id+'='+c.code).join(', ')||'none'}</p></div>
 <div class="card"><h2>Students</h2><div class="row">${f('stn','Name')}${f('ste','Email')}${f('stp','Password','password')}<select id="stc">${opts(C,'id','name')}</select>
 <button onclick="add('/students',{name:v('stn'),email:v('ste'),password:v('stp'),class_id:+v('stc')})">Add student</button></div><div id="stl"></div></div>
 <div class="card"><h2>Faculty & Assignment</h2><div class="row">${f('fn','Name')}${f('fe','Email')}${f('fp','Password','password')}
 <button onclick="add('/faculty',{name:v('fn'),email:v('fe'),password:v('fp')})">Add faculty</button></div>
 <div class="row"><select id="af">${opts(F,'id','name')}</select><select id="asu">${opts(S,'id','name')}</select><select id="acl">${opts(C,'id','name')}</select>
 <button onclick="add('/assignments',{faculty_id:+v('af'),subject_id:+v('asu'),class_id:+v('acl')})">Assign</button></div></div>
 <div class="card"><h2>Rules</h2><div class="row">Low-attendance % <input id="rth" type="number" value="${R.threshold}" style="width:90px"> Correction window (hrs) <input id="rch" type="number" value="${R.correction_hours}" style="width:90px">
 <button onclick="api('/rules','PUT',{threshold:+v('rth'),correction_hours:+v('rch')}).then(()=>toast('Saved'))">Save</button></div></div>
 <div class="card"><h2>Reports</h2>${reportUI()}</div>
 <div class="card"><h2>Audit log</h2><button class="sec" onclick="audit()">Load</button><div id="aud"></div></div>`;
 loadStudents();
}
const v=id=>$('#'+id).value;
async function add(p,b){try{await api(p,'POST',b);toast('Saved');admin()}catch(e){}}
async function loadStudents(){$('#stl').innerHTML=tbl(await api('/students'),['id','name','email','class_id','status'])}
async function audit(){$('#aud').innerHTML=tbl(await api('/audit'),['ts','user_id','action','entity','entity_id'])}
show();
</script></body></html>
